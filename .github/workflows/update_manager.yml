name: Update Tour Manager Data

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Shanghai.
    - cron: "0 22 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: node scripts/manager/refresh-current-station-data.mjs --write --sync

      - run: node scripts/manager/maybe-build-prices.mjs

      - run: node scripts/manager/publish-station-snapshot.mjs --write-file --strict-open

      - run: node scripts/manager/backfill-station-publication-snapshots.mjs

      - run: node scripts/manager/apply-qualifier-placements.mjs

      - run: node scripts/manager/apply-pre-r1-substitutions.mjs

      - run: node scripts/manager/settle-current-or-previous-station.mjs

      - run: node scripts/manager/validate-station.mjs

      - run: python scripts/build_data_manifest.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update tour manager data"
          file_pattern: "data/manager/active_events.json data/manager/events/*.json data/manager/market_snapshot.json data/manager/player_photos.json data/manager/publications/*.json data/manifest.json"

name: Update Tour Manager Data

on:
  workflow_dispatch:
    inputs:
      official_date:
        description: "本次结算的官方赛程日 D，YYYY-MM-DD（留空自动判断；生成 D+1 竞猜）"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/manager/replace-cincinnati-atp-daily-prediction.mjs"
      - "scripts/manager/replace-cincinnati-wta-daily-prediction-20260825.mjs"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: node scripts/manager/refresh-current-station-data.mjs --write --sync

      - run: node scripts/manager/maybe-build-prices.mjs

      - run: node scripts/manager/sync-station.mjs --only-if-market-locked

      - run: node scripts/manager/publish-station-snapshot.mjs --write-file --strict-open

      - run: node scripts/manager/apply-qualifier-placements.mjs

      - run: node scripts/manager/apply-pre-r1-substitutions.mjs

      - run: node scripts/manager/settle-current-or-previous-station.mjs

      - run: node scripts/manager/replace-canada-atp-daily-prediction.mjs

      - run: node scripts/manager/replace-cincinnati-atp-daily-prediction.mjs

      - run: node scripts/manager/replace-cincinnati-wta-daily-prediction-20260825.mjs

      - name: Settle and publish official-day predictions
        env:
          OFFICIAL_DATE: ${{ inputs.official_date }}
        run: |
          args=()
          if [ -n "$OFFICIAL_DATE" ]; then
            args+=(--official-date "$OFFICIAL_DATE")
          fi
          node scripts/manager/update-daily-predictions.mjs "${args[@]}"

      - run: node scripts/manager/validate-station.mjs

      - run: python scripts/build_data_manifest.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update tour manager data"
          file_pattern: "data/manager/active_events.json data/manager/events/*.json data/manager/market_snapshot.json data/manager/player_photos.json data/manager/publications/*.json data/manifest.json"

name: Update Breakdown Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest scripts.test_scoring
      - run: python scripts/fetch_current.py
      - run: python scripts/fetch_breakdown.py
      - run: python scripts/build_data_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update breakdown data"
          file_pattern: "data/current.json data/breakdown.json data/breakdown/*.json data/manifest.json"

name: Live Score Phase 0

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "index.html"
      - "server/live-score/**"
      - "assets/live-score/**"
      - "docs/architecture/**"
      - ".github/workflows/live-score-phase0.yml"
  push:
    paths:
      - "AGENTS.md"
      - "index.html"
      - "server/live-score/**"
      - "assets/live-score/**"
      - "docs/architecture/**"
      - ".github/workflows/live-score-phase0.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/live-score/v2/package-lock.json

      - name: Install isolated V2 typecheck dependency
        working-directory: server/live-score
        run: npm ci --prefix v2

      - name: Verify baseline, architecture, fixtures, cases, and V2 contracts
        working-directory: server/live-score
        run: npm run verify:phase0

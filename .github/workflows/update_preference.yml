name: Update Daily Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest scripts.test_scoring
      - run: python scripts/fetch_history.py
      - run: python scripts/fetch_daily_jinx_settlements.py
      - run: python scripts/build_data_manifest.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update daily history data"
          file_pattern: "data/history.json data/daily_jinx_settlements.json data/history/*.json data/preference/*.json data/manifest.json"

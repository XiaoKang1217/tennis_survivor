name: Update Current Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r scripts/requirements.txt

      - run: python -m unittest scripts.test_scoring

      - run: python scripts/fetch_current.py

      - run: python scripts/build_data_manifest.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update current data"
          file_pattern: "data/current.json data/daily_jinx_pick_counts.json data/manifest.json"

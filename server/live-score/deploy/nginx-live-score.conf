limit_req_zone $binary_remote_addr zone=luwang_live_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name live-api.tennisapi.online;

    location /api/v1/live/stream {
        limit_req zone=luwang_live_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location /api/ {
        limit_req zone=luwang_live_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }
}
